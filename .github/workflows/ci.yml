name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide what the other two say.
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
          - { name: Linux, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v7

      # What Tauri 2 needs to build on Debian/Ubuntu (https://v2.tauri.app/start/prerequisites/).
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Frontend tests
        run: npm test
      # The Tauri context embeds the frontend, so dist/ has to exist before anything in src-tauri compiles.
      - name: Frontend build
        run: npm run build
        env:
          # The Vite build (Monaco) outgrew Node's default heap on the macOS runner.
          NODE_OPTIONS: --max-old-space-size=6144

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      # The tests run the runner's own git in temp folders.
      - name: cargo test
        run: cargo test
        working-directory: src-tauri
